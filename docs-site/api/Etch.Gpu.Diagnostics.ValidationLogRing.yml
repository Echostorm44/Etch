- uid: Etch.Gpu.Diagnostics.ValidationLogRing.Push(Etch.Gpu.ErrorType,System.ReadOnlySpan{System.Byte},System.Int64)
  commentId: M:Etch.Gpu.Diagnostics.ValidationLogRing.Push(Etch.Gpu.ErrorType,System.ReadOnlySpan{System.Byte},System.Int64)
  id: Push(Etch.Gpu.ErrorType,System.ReadOnlySpan{System.Byte},System.Int64)
  parent: Etch.Gpu.Diagnostics.ValidationLogRing
  langs:
  - csharp
  - vb
  name: Push(ErrorType, ReadOnlySpan<byte>, long)
  nameWithType: ValidationLogRing.Push(ErrorType, ReadOnlySpan<byte>, long)
  fullName: Etch.Gpu.Diagnostics.ValidationLogRing.Push(Etch.Gpu.ErrorType, System.ReadOnlySpan<byte>, long)
  type: Method
  assemblies:
  - Etch.Gpu
  namespace: Etch.Gpu.Diagnostics
  summary: >-
    Records one validation entry. Zero managed allocations on this path —

    callers typically invoke from the wgpu-native callback thread. The

    <code class="paramref">timestampTicks</code> argument is supplied by the caller

    (typically <code>IFrameClock.NowNanos</code> or <code>Stopwatch.GetTimestamp</code>

    routed through a determinism seam) so the ring itself stays free of

    non-deterministic API calls.
  example: []
  syntax:
    content: public void Push(ErrorType type, ReadOnlySpan<byte> utf8Message, long timestampTicks)
    parameters:
    - id: type
      type: Etch.Gpu.ErrorType
    - id: utf8Message
      type: System.ReadOnlySpan{System.Byte}
    - id: timestampTicks
      type: System.Int64
    content.vb: Public Sub Push(type As ErrorType, utf8Message As ReadOnlySpan(Of Byte), timestampTicks As Long)
  overload: Etch.Gpu.Diagnostics.ValidationLogRing.Push*
  nameWithType.vb: ValidationLogRing.Push(ErrorType, ReadOnlySpan(Of Byte), Long)
  fullName.vb: Etch.Gpu.Diagnostics.ValidationLogRing.Push(Etch.Gpu.ErrorType, System.ReadOnlySpan(Of Byte), Long)
  name.vb: Push(ErrorType, ReadOnlySpan(Of Byte), Long)
- uid: Etch.Gpu.Diagnostics.ValidationLogRing.Snapshot
  commentId: M:Etch.Gpu.Diagnostics.ValidationLogRing.Snapshot
  id: Snapshot
  parent: Etch.Gpu.Diagnostics.ValidationLogRing
  langs:
  - csharp
  - vb
  name: Snapshot()
  nameWithType: ValidationLogRing.Snapshot()
  fullName: Etch.Gpu.Diagnostics.ValidationLogRing.Snapshot()
  type: Method
  assemblies:
  - Etch.Gpu
  namespace: Etch.Gpu.Diagnostics
  summary: >-
    Encodes the ring into a little-endian byte blob for inclusion in an .etrp section.

    Entries are emitted in chronological order (oldest first). Not called on hot paths.


    Blob layout:
      u32 Count            — number of entries actually present (min(TotalWrites, Capacity))
      per entry:
        i64 TimestampTicks
        u32 ErrorType
        u16 MessageLength
        UTF-8 bytes (MessageLength)
  example: []
  syntax:
    content: public byte[] Snapshot()
    return:
      type: System.Byte[]
    content.vb: Public Function Snapshot() As Byte()
  overload: Etch.Gpu.Diagnostics.ValidationLogRing.Snapshot*
