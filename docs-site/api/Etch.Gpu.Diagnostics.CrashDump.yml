- uid: Etch.Gpu.Diagnostics.CrashDump.BuildFileName(System.String)
  commentId: M:Etch.Gpu.Diagnostics.CrashDump.BuildFileName(System.String)
  id: BuildFileName(System.String)
  parent: Etch.Gpu.Diagnostics.CrashDump
  langs:
  - csharp
  - vb
  name: BuildFileName(string)
  nameWithType: CrashDump.BuildFileName(string)
  fullName: Etch.Gpu.Diagnostics.CrashDump.BuildFileName(string)
  type: Method
  assemblies:
  - Etch.Gpu
  namespace: Etch.Gpu.Diagnostics
  summary: >-
    Builds the canonical crash-dump filename for the current process using the supplied

    UTC timestamp string (typically formatted <code>yyyyMMddHHmmssfff</code>). The timestamp

    is supplied by the caller rather than read from <code>DateTime.UtcNow</code> directly so

    this type stays free of non-deterministic API calls (see ET0105).

    Format: <code>crash-&lt;pid&gt;-&lt;utcStamp&gt;.etrp</code>.
  example: []
  syntax:
    content: public static string BuildFileName(string utcStamp)
    parameters:
    - id: utcStamp
      type: System.String
    return:
      type: System.String
    content.vb: Public Shared Function BuildFileName(utcStamp As String) As String
  overload: Etch.Gpu.Diagnostics.CrashDump.BuildFileName*
  nameWithType.vb: CrashDump.BuildFileName(String)
  fullName.vb: Etch.Gpu.Diagnostics.CrashDump.BuildFileName(String)
  name.vb: BuildFileName(String)
- uid: Etch.Gpu.Diagnostics.CrashDump.TryWrite(Etch.Abstractions.Diagnostics.ISceneReproducer,System.Int32,System.String,System.String)
  commentId: M:Etch.Gpu.Diagnostics.CrashDump.TryWrite(Etch.Abstractions.Diagnostics.ISceneReproducer,System.Int32,System.String,System.String)
  id: TryWrite(Etch.Abstractions.Diagnostics.ISceneReproducer,System.Int32,System.String,System.String)
  parent: Etch.Gpu.Diagnostics.CrashDump
  langs:
  - csharp
  - vb
  name: TryWrite(ISceneReproducer, int, string, string?)
  nameWithType: CrashDump.TryWrite(ISceneReproducer, int, string, string?)
  fullName: Etch.Gpu.Diagnostics.CrashDump.TryWrite(Etch.Abstractions.Diagnostics.ISceneReproducer, int, string, string?)
  type: Method
  assemblies:
  - Etch.Gpu
  namespace: Etch.Gpu.Diagnostics
  summary: >-
    Captures the supplied reproducer and writes the bytes to the resolved crash directory

    under <code>crash-&lt;pid&gt;-&lt;utcStamp&gt;.etrp</code>. Returns the full path on success,

    or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> if the write failed (disk full, permissions, etc.). Never

    throws — callers typically invoke from a top-level panic handler that must not observe

    a secondary failure. When <code class="paramref">directoryOverride</code> is non-null the env

    var / temp fallback is bypassed — useful for tests that need isolation from the

    process-global environment.
  example: []
  syntax:
    content: public static string? TryWrite(ISceneReproducer reproducer, int upperBoundBytes, string utcStamp, string? directoryOverride = null)
    parameters:
    - id: reproducer
      type: Etch.Abstractions.Diagnostics.ISceneReproducer
    - id: upperBoundBytes
      type: System.Int32
    - id: utcStamp
      type: System.String
    - id: directoryOverride
      type: System.String
    return:
      type: System.String
    content.vb: Public Shared Function TryWrite(reproducer As ISceneReproducer, upperBoundBytes As Integer, utcStamp As String, directoryOverride As String = Nothing) As String
  overload: Etch.Gpu.Diagnostics.CrashDump.TryWrite*
  nameWithType.vb: CrashDump.TryWrite(ISceneReproducer, Integer, String, String)
  fullName.vb: Etch.Gpu.Diagnostics.CrashDump.TryWrite(Etch.Abstractions.Diagnostics.ISceneReproducer, Integer, String, String)
  name.vb: TryWrite(ISceneReproducer, Integer, String, String)
