- uid: Etch.Gpu.Diagnostics.CrashDump.ResolveDirectory
  commentId: M:Etch.Gpu.Diagnostics.CrashDump.ResolveDirectory
  id: ResolveDirectory
  parent: Etch.Gpu.Diagnostics.CrashDump
  langs:
  - csharp
  - vb
  name: ResolveDirectory()
  nameWithType: CrashDump.ResolveDirectory()
  fullName: Etch.Gpu.Diagnostics.CrashDump.ResolveDirectory()
  type: Method
  assemblies:
  - Etch.Gpu
  namespace: Etch.Gpu.Diagnostics
  summary: >-
    Resolves the directory into which crash dumps should be written. The env var

    takes precedence; otherwise falls back to <code>Path.GetTempPath()/etch</code>. The

    returned directory is created if missing (best-effort).
  example: []
  syntax:
    content: public static string ResolveDirectory()
    return:
      type: System.String
    content.vb: Public Shared Function ResolveDirectory() As String
