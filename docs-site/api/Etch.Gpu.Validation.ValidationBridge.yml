- uid: Etch.Gpu.Validation.ValidationBridge.ThrowIfValidationErrorsPresent(System.String)
  commentId: M:Etch.Gpu.Validation.ValidationBridge.ThrowIfValidationErrorsPresent(System.String)
  id: ThrowIfValidationErrorsPresent(System.String)
  parent: Etch.Gpu.Validation.ValidationBridge
  langs:
  - csharp
  - vb
  name: ThrowIfValidationErrorsPresent(string)
  nameWithType: ValidationBridge.ThrowIfValidationErrorsPresent(string)
  fullName: Etch.Gpu.Validation.ValidationBridge.ThrowIfValidationErrorsPresent(string)
  type: Method
  assemblies:
  - Etch.Gpu
  namespace: Etch.Gpu.Validation
  summary: >-
    Throws <xref href="Etch.EtchException" data-throw-if-not-resolved="false"></xref> with code <code>ET-P-0201 GpuValidation</code>

    if the ring contains any entries written since the last call to this method.

    Returns the number of new errors found (zero on success).
  remarks: Use this after <code>Queue.Submit</code> in strict-validation mode (tests).
  example: []
  syntax:
    content: public static int ThrowIfValidationErrorsPresent(string context)
    parameters:
    - id: context
      type: System.String
    return:
      type: System.Int32
    content.vb: Public Shared Function ThrowIfValidationErrorsPresent(context As String) As Integer
