  nameWithType: ValidationBridge.AcknowledgeAll()
  fullName: Etch.Gpu.Validation.ValidationBridge.AcknowledgeAll()
  type: Method
  assemblies:
  - Etch.Gpu
  namespace: Etch.Gpu.Validation
  summary: >-
    Advances the internal counter so that all current ring entries are

    considered acknowledged. Use in test cleanup to avoid cross-test

    interference on the shared <xref href="Etch.Gpu.Validation.ValidationBridge.Ring" data-throw-if-not-resolved="false"></xref>.
