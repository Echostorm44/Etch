  namespace: Etch.Gpu.Validation
  summary: >-
    Bridges wgpu-native validation messages into Etch's error infrastructure.

    In v29 the uncaptured-error callback is set at device-creation time via

    <xref href="Etch.Gpu.Descriptors.DeviceDescriptor.UncapturedErrorCallbackInfo" data-throw-if-not-resolved="false"></xref>; there is no

    separate <code>wgpuDeviceSetUncapturedErrorCallback</code> setter.
