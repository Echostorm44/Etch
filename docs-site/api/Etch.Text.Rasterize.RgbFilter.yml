    - id: src
      type: System.ReadOnlySpan{System.Byte}
      description: Source buffer, width = <code class="paramref">w3</code>, height = <code class="paramref">h</code>.
    - id: w3
      type: System.Int32
      description: Width in pixels (already 3×).
    - id: h
      type: System.Int32
      description: Height in pixels.
    - id: dest
      type: System.Span{System.Byte}
      description: Destination RGBA8 buffer, width = w3/3, height = h.
