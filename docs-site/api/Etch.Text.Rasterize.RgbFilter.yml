  namespace: Etch.Text.Rasterize
  summary: >-
    Horizontal RGB subpixel LCD filter.

    Applies a 5-tap low-pass kernel ([1, 3, 5, 3, 1] / 13) to a 3× horizontal

    resolution grayscale buffer, then downsamples into RGBA8.
