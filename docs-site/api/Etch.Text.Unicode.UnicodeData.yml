  langs:
  - csharp
  - vb
  name: GetParagraphRuns(ReadOnlySpan<char>, sbyte)
  nameWithType: UnicodeData.GetParagraphRuns(ReadOnlySpan<char>, sbyte)
  fullName: Etch.Text.Unicode.UnicodeData.GetParagraphRuns(System.ReadOnlySpan<char>, sbyte)
  type: Method
  assemblies:
  - Etch.Text
  namespace: Etch.Text.Unicode
  summary: >-
    Analyse a single paragraph and return visual-order BiDi runs.

    Uses our own UAX #9 implementation because ICU4N does not expose

    a public BiDi class.
  example: []
  syntax:
    content: public static BidiParagraphResult GetParagraphRuns(ReadOnlySpan<char> text, sbyte paragraphLevel = -1)
    parameters:
    - id: text
      type: System.ReadOnlySpan{System.Char}
      description: Paragraph text.
    - id: paragraphLevel
      type: System.SByte
      description: 0 = LTR, 1 = RTL, -1 = auto-detect.
    return:
      type: Etch.Text.Unicode.Minimal.BidiParagraphResult
    content.vb: Public Shared Function GetParagraphRuns(text As ReadOnlySpan(Of Char), paragraphLevel As SByte = -1) As BidiParagraphResult
