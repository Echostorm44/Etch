- uid: Etch.Text.QuantizedSubpixel.QuantizeX(System.Single,Etch.Text.SubpixelQuant)
  commentId: M:Etch.Text.QuantizedSubpixel.QuantizeX(System.Single,Etch.Text.SubpixelQuant)
  id: QuantizeX(System.Single,Etch.Text.SubpixelQuant)
  parent: Etch.Text.QuantizedSubpixel
  langs:
  - csharp
  - vb
  name: QuantizeX(float, SubpixelQuant)
  nameWithType: QuantizedSubpixel.QuantizeX(float, SubpixelQuant)
  fullName: Etch.Text.QuantizedSubpixel.QuantizeX(float, Etch.Text.SubpixelQuant)
  type: Method
  assemblies:
  - Etch.Text
  namespace: Etch.Text
  summary: >-
    Returns the quantized subpixel bucket for <code class="paramref">x</code>.

    For <xref href="Etch.Text.SubpixelQuant.Quarter" data-throw-if-not-resolved="false"></xref> the result is 0..3;

    for <xref href="Etch.Text.SubpixelQuant.Eighth" data-throw-if-not-resolved="false"></xref> it is 0..7.

    Negative values wrap correctly (e.g. –0.3 → same bucket as 0.7).
  example: []
  syntax:
    content: public static byte QuantizeX(float x, SubpixelQuant q)
    parameters:
    - id: x
      type: System.Single
    - id: q
      type: Etch.Text.SubpixelQuant
    return:
      type: System.Byte
    content.vb: Public Shared Function QuantizeX(x As Single, q As SubpixelQuant) As Byte
  overload: Etch.Text.QuantizedSubpixel.QuantizeX*
  nameWithType.vb: QuantizedSubpixel.QuantizeX(Single, SubpixelQuant)
