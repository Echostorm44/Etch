- uid: Etch.ClipBlendGradient.GradientInterpolationSpace.LinearLight
  commentId: F:Etch.ClipBlendGradient.GradientInterpolationSpace.LinearLight
  id: LinearLight
  parent: Etch.ClipBlendGradient.GradientInterpolationSpace
  langs:
  - csharp
  - vb
  name: LinearLight
  nameWithType: GradientInterpolationSpace.LinearLight
  fullName: Etch.ClipBlendGradient.GradientInterpolationSpace.LinearLight
  type: Field
  assemblies:
  - Etch.ClipBlendGradient
  namespace: Etch.ClipBlendGradient
  summary: >-
    Linear-light interpolation (default). Colors are converted to linear space before

    interpolating, then converted back to the output space. Produces perceptually

    correct gradients especially for bright colors and long gradients.
  example: []
  syntax:
    content: LinearLight = 0
    return:
      type: Etch.ClipBlendGradient.GradientInterpolationSpace
- uid: Etch.ClipBlendGradient.GradientInterpolationSpace.Srgb
  commentId: F:Etch.ClipBlendGradient.GradientInterpolationSpace.Srgb
  id: Srgb
  parent: Etch.ClipBlendGradient.GradientInterpolationSpace
  langs:
  - csharp
  - vb
  name: Srgb
  nameWithType: GradientInterpolationSpace.Srgb
  fullName: Etch.ClipBlendGradient.GradientInterpolationSpace.Srgb
  type: Field
  assemblies:
  - Etch.ClipBlendGradient
  namespace: Etch.ClipBlendGradient
  summary: >-
    sRGB interpolation. Matches legacy CSS 3 behaviour — colors are interpolated

    directly in sRGB space without linearization.
  remarks: >-
    WARNING: sRGB interpolation produces muddy midtones in red-to-green and similar

    gradients where both channels are changing significantly. Prefer LinearLight for

    new work. This option is provided only for legacy authoring compatibility.
  example: []
  syntax:
    content: Srgb = 1
    return:
      type: Etch.ClipBlendGradient.GradientInterpolationSpace
