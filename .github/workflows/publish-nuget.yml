# ─────────────────────────────────────────────────────────────────────────────
# publish-nuget.yml — publish the Echostorm.Etch bundle to NuGet.org
# ─────────────────────────────────────────────────────────────────────────────
# Triggered when a version tag (v*) is pushed. Uses NuGet Trusted Publishing
# (GitHub Actions OIDC) — no API key stored in the repo. Same pattern as SharpImage.
#
# Prerequisite — configure a NuGet Trusted Publishing policy on nuget.org:
#   Package          : Echostorm.Etch
#   Repository Owner  : Echostorm44
#   Repository        : Etch
#   Workflow File     : publish-nuget.yml
#   Environment       : nuget-publish
#
# Pre-release: tag with the suffix, e.g.  git tag v0.1.0-alpha.2 && git push --tags
# The version is derived from the tag (v0.1.0-alpha.2 -> 0.1.0-alpha.2), so anything
# with a '-suffix' publishes as a pre-release and stays out of default search results.
#
# Publish ORDER: Echostorm.Etch must be on NuGet before Cascade.UI is published,
# since Cascade.UI depends on it.
# ─────────────────────────────────────────────────────────────────────────────

name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  PACKAGE_PROJECT: packaging/Echostorm.Etch/Echostorm.Etch.csproj

jobs:
  publish:
    name: Pack & Publish (Echostorm.Etch)
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      id-token: write   # required for OIDC token issuance
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Building the Etch assemblies needs the wgpu native binaries (fetched, not committed).
      # Shader validation (which shells out to naga) is skipped at pack time via
      # SkipShaderValidation — it's a build-time check that doesn't affect the packaged DLLs.
      - name: Fetch wgpu native binaries
        shell: pwsh
        run: ./native/wgpu-native/fetch.ps1 all

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$TAG" >> "$GITHUB_OUTPUT"
          echo "📦 Echostorm.Etch $TAG"

      - name: Restore
        run: dotnet restore ${{ env.PACKAGE_PROJECT }}

      # SkipShaderValidation: shader validation is a build-time correctness check (it shells
      # out to naga) that doesn't affect the packaged assemblies — Etch's own shader-CI job
      # enforces it; the pack just needs to emit the DLLs. No analyzer/warning suppression:
      # the source is clean under the design-rule analyzers.
      - name: Pack
        run: dotnet pack ${{ env.PACKAGE_PROJECT }} -c ${{ env.CONFIGURATION }} -p:SkipShaderValidation=true /p:Version=${{ steps.version.outputs.VERSION }} -o ./artifacts

      - name: NuGet login (OIDC Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Echostorm

      - name: Push to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          retention-days: 30
