name: Soak (manual)

# Long-running endurance test: renders an animated scene in a loop and watches for
# memory growth, GC-pause spikes, frame-time drift and panics. It is NOT scheduled —
# a 24h runner every night is wasteful for an infrequently-updated repo and would be
# ruinously expensive if this repo were ever made private (Windows minutes bill at 2x).
# Run it by hand from the Actions tab before a release. The short "smoke" soak tests
# still run in the Correctness workflow on every push.
on:
  workflow_dispatch:

jobs:
  soak:
    runs-on: windows-latest
    timeout-minutes: 1500

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Etch.sln

      - name: Install wgpu-native
        run: ./native/wgpu-native/fetch.ps1 all
        shell: pwsh

      - name: Build
        run: dotnet build Etch.sln -c Release --no-restore

      - name: Soak Test (24h)
        env:
          ETCH_SOAK_NIGHTLY: '1'
        run: dotnet run --project tests/Etch.Correctness.Tests/Etch.Correctness.Tests.csproj -c Release --no-build

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report
          path: tests/Etch.Correctness.Tests/bin/Release/net10.0/soak-report.json
