name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  push:
    branches: [main]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
        include:
          - rid: win-x64
            os: windows-2022
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: osx-arm64
            os: macos-14

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Etch.sln

      # The published wgpu-native release, or (until it is published) a cached source build of the
      # runner's RID: .github/actions/wgpu-native.
      - name: Provide wgpu-native
        uses: ./.github/actions/wgpu-native
        with:
          rids: all

      # naga-cli backs Etch.Shaders.Tests and Etch.Build.Tests (NagaValidation). Its version is
      # pinned in build/NagaCli.props; the cargo build is cached per OS so only a bump rebuilds it.
      - name: Resolve naga-cli version
        id: naga
        run: echo "version=$(./tools/ci/install-naga.ps1 -PrintVersion)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Cache naga-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/naga
            ~/.cargo/bin/naga.exe
          key: naga-cli-${{ steps.naga.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install naga-cli
        run: ./tools/ci/install-naga.ps1
        shell: pwsh

      # The kurbo oracle is a Rust cdylib (not checked in) used by Etch.Geometry.Differential.
      - name: Build kurbo oracle
        run: ./tools/ci/build-oracle.ps1 -Targets ${{ matrix.rid }}
        shell: pwsh

      - name: Build
        run: dotnet build Etch.sln -c Release --no-restore

      # The Linux runner has no GPU, so the GPU suites run on Lavapipe (Mesa's software Vulkan).
      # libvulkan1 is the loader wgpu dlopens; mesa-vulkan-drivers provides the lvp ICD. (The GPU
      # suites used to be skipped here as "segfaulting against software Vulkan"; the crash was the
      # by-value callback-info ABI bug fixed in Etch.Gpu.Native, not Lavapipe.)
      - name: Install Lavapipe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
          # The ICD file name varies with the Mesa version: lvp_icd.x86_64.json exists with Mesa 25.0
          # but not with the runner's 25.2 ("Failed to open JSON file"), so find it, and fail here
          # if Lavapipe is not usable: GPU tests that find no adapter skip, which would hide it.
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          test -n "$icd"
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary | grep -i llvmpipe
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
        shell: bash

      # Test fonts are downloaded on first use (font files are not checked in) and kept in
      # ETCH_TEST_FONTS_DIR (tests/Etch.TestFonts, SHA-256 pinned); caching it spares every run the download
      # and keeps the suites green when the font host is unreachable. Bump the key to refetch.
      - name: Cache test fonts
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.test-fonts
          key: etch-test-fonts-v1

      # Every suite under tests/, minus the Flaky and Performance categories (see the script header).
      # GPU suites run on WARP (Windows), Lavapipe (Linux) and Metal (macOS).
      - name: Run tests (excluding Flaky and Performance)
        run: ./tools/ci/run-all-tests.ps1
        shell: pwsh
        env:
          ETCH_TEST_FONTS_DIR: ${{ github.workspace }}/.test-fonts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults/

      # GPU/CPU parity failures write actual | expected | diff PNGs next to the test binaries.
      - name: Upload parity failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-failures-${{ matrix.rid }}
          path: tests/*/bin/Release/*/parity-failures/
          if-no-files-found: ignore

  aot-publish:
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
        include:
          - rid: win-x64
            os: windows-2022
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: osx-arm64
            os: macos-14

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish AOT
        run: dotnet publish src/Etch.Abstractions -c Release -r ${{ matrix.rid }} --self-contained -p:PublishAot=true 2>&1 | tee publish.log
        shell: pwsh

      - name: Check AOT warnings
        run: ./tools/ci/check-aot-warnings.ps1 -Log publish.log -Namespace Etch
        shell: pwsh

      - name: Upload publish logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-logs-${{ matrix.rid }}
          path: publish.log

  analyzer-gate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Etch.sln

      # The published wgpu-native release, or (until it is published) a cached source build of the
      # runner's RID: .github/actions/wgpu-native.
      - name: Provide wgpu-native
        uses: ./.github/actions/wgpu-native
        with:
          rids: all

      - name: Build with analyzers
        run: dotnet build Etch.sln -c Release -p:RunAnalyzersDuringBuild=true -p:TreatWarningsAsErrors=true --no-restore

  shader-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # naga-cli backs Etch.Shaders.Tests and Etch.Build.Tests (NagaValidation). Its version is
      # pinned in build/NagaCli.props; the cargo build is cached per OS so only a bump rebuilds it.
      - name: Resolve naga-cli version
        id: naga
        run: echo "version=$(./tools/ci/install-naga.ps1 -PrintVersion)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Cache naga-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/naga
            ~/.cargo/bin/naga.exe
          key: naga-cli-${{ steps.naga.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install naga-cli
        run: ./tools/ci/install-naga.ps1
        shell: pwsh

      - name: Validate shaders
        run: |
          # naga-cli validates a module on load; passing no output file validates only.
          # globstar makes shaders/**/*.wgsl include top-level shaders too (and the for-loop
          # runs in the main shell, so exit 1 actually fails the step).
          shopt -s globstar nullglob
          for f in shaders/**/*.wgsl; do
            naga "$f" || exit 1
          done
        shell: bash

      - name: Cross-compile to SPIR-V
        run: |
          shopt -s globstar nullglob
          for f in shaders/**/*.wgsl; do
            naga "$f" "/tmp/test_$${RANDOM}.spv" || exit 1
          done
        shell: bash

      - name: Cross-compile to Metal
        run: |
          # Metal 2.1 is required for the instance_index builtin (strip_coverage.wgsl);
          # naga's default MSL version rejects it.
          shopt -s globstar nullglob
          for f in shaders/**/*.wgsl; do
            naga "$f" --metal-version 2.1 "/tmp/test_$${RANDOM}.metal" || exit 1
          done
        shell: bash

      - name: Cross-compile to HLSL
        run: |
          shopt -s globstar nullglob
          for f in shaders/**/*.wgsl; do
            naga "$f" "/tmp/test_$${RANDOM}.hlsl" || exit 1
          done
        shell: bash

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The published wgpu-native release, or (until it is published) a cached source build of the
      # runner's RID: .github/actions/wgpu-native.
      - name: Provide wgpu-native
        uses: ./.github/actions/wgpu-native
        with:
          rids: all

      - name: Restore
        run: dotnet restore tests/Etch.Shaders.Tests/Etch.Shaders.Tests.csproj

      - name: Build shader tests
        run: dotnet build tests/Etch.Shaders.Tests/Etch.Shaders.Tests.csproj -c Release --no-restore

      - name: Run shader validation tests
        run: dotnet run --project tests/Etch.Shaders.Tests/Etch.Shaders.Tests.csproj -c Release --no-build
        shell: bash

  sbom:
    needs: [aot-publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-2022
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: osx-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish for SBOM
        run: dotnet publish src/Etch.Abstractions -c Release -r ${{ matrix.rid }} --self-contained -p:PublishAot=true -o ./sbom-out/${{ matrix.rid }}

      - name: Generate SBOM
        run: ./tools/ci/generate-sbom.ps1 -OutputPath ./sbom-out/${{ matrix.rid }}/Etch.Abstractions.spdx.json
        shell: pwsh

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.rid }}
          path: sbom-out/${{ matrix.rid }}/Etch.Abstractions.spdx.json
          retention-days: 90

  flake-lane:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run flaky tests
        run: |
          # TUnit on .NET 10 requires dotnet run. When a dedicated flaky test
          # project is created, run it here. For now, this lane is a template.
          echo "Flaky-test lane active (no dedicated flaky project yet)."
